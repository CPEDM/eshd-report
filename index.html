<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>풍산시스템 설비 인수인계 시스템</title>
  
  <!-- 모바일 브라우저 탭 바 다크 테마 색상 일치 -->
  <meta name="theme-color" content="#0b0f19">
  
  <style>
    /* 여백 제거 및 브라우저 스크롤 완벽 차단 (내부 웹앱 자체 스크롤 활용) */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }

    /* 모바일 키보드 팝업 시 꿀렁거림 방지 100% 풀스크린 고정 */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 여기에 현재 운영 중인 구글 웹앱 URL(?ssid= 제외한 순수 exec URL)을 넣으세요 -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbyyrHJyw84-bojl4r4qcKT4ZiB42zzgLi5STm8c2Fi9LzHPmgNIWXhbmr9PK1C61Fa6sw/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>
</body>
</html>
