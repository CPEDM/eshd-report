<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>풍산시스템 설비 인수인계 시스템</title>
  
  <!-- 모바일 브라우저 상단바 다크 테마 일치 -->
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* 기본 여백 완전 제거 및 외부 스크롤 차단 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }

    /* 100% 풀스크린 반응형 iframe (모바일 가상 키보드 팝업 시 꿀렁거림 완벽 방어) */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbyyrHJyw84-bojl4r4qcKT4ZiB42zzgLi5STm8c2Fi9LzHPmgNIWXhbmr9PK1C61Fa6sw/exec"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>
</body>
</html>
